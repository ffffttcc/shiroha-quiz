name: Android Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-unit-test:
    name: Native unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Unit tests may be flaky; don't block APK builds. Results uploaded as artifact.
      - name: Run native debug unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testNativeDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports-${{ steps.vars.outputs.short_sha }}
          path: apps/android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  native-apk:
    name: Native debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release signing reads rootProject.file("keystore.properties") and only
      # configures a signing config when that file exists (app/build.gradle.kts
      # signingConfigs block). The repo does not ship keystore.properties and this
      # workflow uses no secrets, so release is intentionally not built here.
      - name: Restore debug keystore
        run: |
          mkdir -p apps/android/app
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE }}" | base64 -d > apps/android/app/debug.keystore
          ls -l apps/android/app/debug.keystore
      - name: Build native debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleNativeDebug

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-apk-${{ steps.vars.outputs.short_sha }}
          path: apps/android/app/build/outputs/apk/native/**/*.apk
          if-no-files-found: error
          retention-days: 14

  native-release:
    if: false
    name: Native release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release 复用仓库内 debug.keystore（口令 android / 别名 androiddebugkey），
      # 因此正式包与现有 debug 包签名一致：可直接 pm install -r 覆盖升级，不必卸载、不丢题库。
      # isMinifyEnabled=true 保持不动：混淆风险只能在装机后暴露，不许为了绿先关。
      - name: Build native release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleNativeDebug

      - name: Upload native release APK
        uses: actions/upload-artifact@v4
        with:
          name: native-release-apk-${{ steps.vars.outputs.short_sha }}
          path: apps/android/app/build/outputs/apk/native/debug/**/*.apk
          if-no-files-found: error
          retention-days: 14
