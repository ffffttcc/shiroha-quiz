name: Android Native CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-unit-test:
    name: Native unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # A failing unit test must fail this job: no continue-on-error anywhere.
      - name: Run native debug unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testNativeDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports-${{ steps.vars.outputs.short_sha }}
          path: apps/android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  native-apk:
    name: Native debug APK
    runs-on: ubuntu-latest
    needs: native-unit-test
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release signing reads rootProject.file("keystore.properties") and only
      # configures a signing config when that file exists (app/build.gradle.kts
      # signingConfigs block). The repo does not ship keystore.properties and this
      # workflow uses no secrets, so release is intentionally not built here.
      - name: Build native debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleNativeDebug

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: native-debug-apk-${{ steps.vars.outputs.short_sha }}
          path: apps/android/app/build/outputs/apk/native/**/*.apk
          if-no-files-found: error
          retention-days: 14
