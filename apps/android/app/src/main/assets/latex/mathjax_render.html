<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script>
        window.__bootError = '';
        window.onerror = function (msg, src, line, col, err) {
            window.__bootError = String(msg) + ' @' + (src || '') + ':' + line + ':' + col;
            return true;
        };
        // CommonJS shim: this bundle is built for Node/CommonJS environment
        if (typeof window.require === 'undefined') {
            window.require = function (id) {
                if (id === 'path') return { resolve: function () { return '/tmp'; }, join: function () { return '/tmp'; } };
                return {};
            };
        }
        if (typeof window.__dirname === 'undefined') { window.__dirname = '/tmp'; }
        if (typeof window.module === 'undefined') { window.module = { exports: {} }; }
        if (typeof window.exports === 'undefined') { window.exports = window.module.exports; }
    </script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$','$']],
                displayMath: [['$$','$$']],
                packages: { '[+]': ['mhchem', 'ams', 'color', 'boldsymbol', 'newcommand'] }
            },
            svg: { fontCache: 'local' },
            startup: { typeset: false },
            options: { enableMenu: false }
        };
    </script>
    <script src="mathjax.bundle.js" onload="markReady()" onerror="window.__bootError='bundle 404/load error'"></script>
    <script>
        window.__ready = false;
        window.__bootError = '';

        function markReady() {
            try {
                if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
                    MathJax.startup.promise.then(function () { window.__ready = true; })
                        .catch(function (e) { window.__bootError = 'startup: ' + e; });
                } else {
                    window.__bootError = window.__bootError || ('MathJax undefined, typeof=' + (typeof window.MathJax));
                }
            } catch (e) { window.__bootError = 'markReady: ' + e; }
        }

        window.isReady = function () {
            if (window.__ready === true) return 'true';
            return 'false|' + (window.__bootError || ('MathJax=' + (typeof window.MathJax) + ',renderLatex=' + (typeof window.renderLatex)));
        };

        window.__lastRenderResult = '';

        window.renderBatch = function (jsonItems) {
            try {
                var items = JSON.parse(jsonItems);
                var results = [];

                for (var i = 0; i < items.length; i++) {
                    var it = items[i];
                    try {
                        var svg = MathJax.tex2svg(it.tex, { display: true });
                        var svgEl = svg.querySelector('svg') || svg;
                        if (it.color) svgEl.style.color = it.color;
                        var vb = (svgEl.getAttribute('viewBox') || '0 0 100 100').trim().split(/[\s,]+/).map(Number);
                        var vbW = vb[2] || 100, vbH = vb[3] || 100;
                        var dpr = window.devicePixelRatio || 1;
                        var h = Math.max(1, Math.round(it.heightPx * dpr));
                        var w = Math.max(1, Math.round(h * vbW / vbH));
                        var xml = new XMLSerializer().serializeToString(svgEl);
                        var dataUri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
                        var img = new Image();
                        img.onload = function () {
                            try {
                                var cv = document.createElement('canvas');
                                cv.width = w; cv.height = h;
                                var ctx = cv.getContext('2d');
                                ctx.clearRect(0, 0, w, h);
                                ctx.drawImage(img, 0, 0, w, h);
                                var url = cv.toDataURL('image/png');
                                results.push({ id: it.id, pngBase64: url.substring(url.indexOf(',') + 1) });
                            } catch (e) {
                                results.push({ id: it.id, error: 'RASTER: ' + String(e && e.message ? e.message : e) });
                            }
                            // Store result when all items done
                            if (results.length === items.length) {
                                window.__lastRenderResult = JSON.stringify(results);
                            }
                        };
                        img.onerror = function () {
                            results.push({ id: it.id, error: 'IMG_LOAD_FAILED' });
                            if (results.length === items.length) {
                                window.__lastRenderResult = JSON.stringify(results);
                            }
                        };
                        img.src = dataUri;
                    } catch (e) {
                        results.push({ id: it.id, error: 'TEX2SVG: ' + String(e && e.message ? e.message : e) });
                        if (results.length === items.length) {
                            window.__lastRenderResult = JSON.stringify(results);
                        }
                    }
                }

                // Return empty string; caller polls via getResult()
                return '';
            } catch (e) {
                return JSON.stringify([{ id: -1, error: 'PARSE: ' + String(e && e.message ? e.message : e) }]);
            }
        };

        window.getResult = function () {
            var r = window.__lastRenderResult;
            window.__lastRenderResult = '';
            return r;
        };
    </script>
</head>
<body></body>
</html>
